<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Comptes &amp; Sopes</title>
<meta name="apple-mobile-web-app-title" content="Comptes & Sopes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#40805d">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  html,body{margin:0;height:100%;background:#40805d;font:16px -apple-system,system-ui,sans-serif;color:#fff}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f2f2f7}
  .msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:14px}
  .msg img{width:96px;height:96px;border-radius:22px}
  .msg p{margin:0;opacity:.9;line-height:1.5}
</style>
</head>
<body>
<script>
  /* Adreça de l'app (Google Apps Script). Si mai canvia, només s'ha de canviar aquesta línia. */
  var APP = 'https:/' + '/script.google.com/macros/s/AKfycbyzcxVz3kzClhVuXqyEXzbITYxSpSaKIFOyRs9x6DKeUzIixZ6Fb_DGCEzW0axpF8hM4w/exec';
  var q = location.search || '';
  if (/[?&]nom=/.test(q)) {
    var f = document.createElement('iframe');
    f.src = APP + q;
    f.allow = 'camera; clipboard-write; web-share';
    f.title = 'Comptes & Sopes';
    document.body.appendChild(f);
  } else {
    document.body.innerHTML = '<div class="msg"><img src="apple-touch-icon.png" alt=""><b>Comptes &amp; Sopes</b><p>Obre l’app amb el teu enllaç personal.<br>Si no el tens, demana’l al tresorer.</p></div>';
  }
</script>
</body>
</html>
